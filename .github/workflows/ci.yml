name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the build job asks for package write on its own.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. kwamib/civicgrid-api

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, so a GitHub image
# change (ubuntu-latest moving to a new release) happens when we choose, in its own PR.
# Action versions are kept current by Dependabot (.github/dependabot.yml).

jobs:
  # =========================================
  # 1. Lint Python with ruff
  # =========================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/

      - name: Run ruff format check
        run: ruff format --check app/

  # =========================================
  # 2. Tests: unit tests plus the integration tests against a throwaway Postgres.
  # The service container is reachable at localhost:5432, which is the only kind
  # of host the integration tests accept (they drop the public schema).
  # =========================================
  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicgrid_test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest -q

  # =========================================
  # 3. Lint Helm chart and verify it renders
  # =========================================
  helm-lint:
    name: Helm lint + template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Helm lint
        run: helm lint charts/civicgrid-api

      - name: Helm template (smoke test)
        run: |
          helm template ci-test charts/civicgrid-api \
            --set database.url="postgresql://placeholder" \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  # =========================================
  # 4. Build Docker image and push to GHCR
  # Only pushes from main branch and version tags. PRs only build, don't push.
  # Waits for lint, tests and Helm, so a failing test never produces an image.
  # amd64 only: the cluster's node is amd64, and the arm64 build doubled build time.
  # =========================================
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-24.04
    needs: [lint, test, helm-lint]
    permissions:
      contents: read
      packages: write          # required to push to GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest tag for default branch only
            type=raw,value=latest,enable={{is_default_branch}}
            # branch name (main, feat/foo, etc.)
            type=ref,event=branch
            # PR number for PR builds
            type=ref,event=pr
            # short SHA for traceability
            type=sha,format=short
            # semver tags like v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
