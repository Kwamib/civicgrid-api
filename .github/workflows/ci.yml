name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. kwamib/civicgrid-api

jobs:
  # =========================================
  # 1. Lint Python with ruff
  # =========================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/

      - name: Run ruff format check
        run: ruff format --check app/

  # =========================================
  # 2. Lint Helm chart and verify it renders
  # =========================================
  helm-lint:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm lint
        run: helm lint charts/civicgrid-api

      - name: Helm template (smoke test)
        run: |
          helm template ci-test charts/civicgrid-api \
            --set database.url="postgresql://placeholder" \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  # =========================================
  # 3. Build Docker image and push to GHCR
  # Only pushes from main branch and version tags. PRs only build, don't push.
  # =========================================
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [lint, helm-lint]
    permissions:
      contents: read
      packages: write          # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest tag for default branch only
            type=raw,value=latest,enable={{is_default_branch}}
            # branch name (main, feat/foo, etc.)
            type=ref,event=branch
            # PR number for PR builds
            type=ref,event=pr
            # short SHA for traceability
            type=sha,format=short
            # semver tags like v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64