{{- if .Values.webhookDrain.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "civicgrid-api.fullname" . }}-webhook-drain
  labels:
    {{- include "civicgrid-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-drain
spec:
  schedule: {{ .Values.webhookDrain.schedule | quote }}
  # Forbid: if a run is still going when the next tick fires, skip the new one
  # rather than overlap. Combined with the drain's FOR UPDATE SKIP LOCKED claim,
  # this prevents double-delivery.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.webhookDrain.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.webhookDrain.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.webhookDrain.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # Hard ceiling on a single run so a hung job can't block the next tick.
      activeDeadlineSeconds: {{ .Values.webhookDrain.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.webhookDrain.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "civicgrid-api.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: webhook-drain
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "civicgrid-api.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: webhook-drain
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.webhooks.drain"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "civicgrid-api.databaseSecretName" . }}
                      key: {{ .Values.database.existingSecretKey }}
              resources:
                {{- toYaml .Values.webhookDrain.resources | nindent 16 }}
              {{- if .Values.securityContext.readOnlyRootFilesystem }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              {{- end }}
          {{- if .Values.securityContext.readOnlyRootFilesystem }}
          volumes:
            - name: tmp
              emptyDir: {}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
