replicaCount: 1

image:
  repository: ghcr.io/kwamib/civicgrid-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# Redis is used as the rate-limit counter store. Falls back to in-memory
# (per-pod, not shared) if url is empty — useful for local dev.
# In-cluster default points at the Bitnami Redis chart installed via
# the gitops repo at infra/redis/.
redis:
  url: "redis://redis-master.redis.svc.cluster.local:6379/0"

# Admin token guards POST/GET/DELETE /admin/keys endpoints. Required for
# creating, listing, or revoking API keys. Must be set via existingSecret
# in production — the in-chart fallback (admin.token) is for local dev only.
admin:
  token: ""
  existingSecret: ""
  existingSecretKey: "ADMIN_TOKEN"

# Supabase JWT secret for validating user authentication tokens in /me endpoints.
# Set via existingSecret in production. The in-chart fallback (jwt.secret) is for
# local dev only. Stored alongside ADMIN_TOKEN in the civicgrid-admin K8s secret.
jwt:
  secret: ""
  existingSecret: ""
  existingSecretKey: "SUPABASE_JWT_SECRET"

# Supabase URL for JWKS endpoint discovery (used by /me JWT validation).
# Stored in the civicgrid-admin K8s secret as SUPABASE_URL.
supabase:
  urlSecretKey: "SUPABASE_URL"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: civicgrid-api
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

# ServiceMonitor for Prometheus Operator integration.
# Disabled by default; clusters without Prometheus Operator (no ServiceMonitor CRD)
# would fail to install the chart otherwise.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

# Webhook delivery drain. Runs `python -m app.webhooks.drain` on a schedule as
# a CronJob, using the SAME image as the API (the drain code ships in it) and
# the same DATABASE_URL secret. Right-sized for low event volume; see
# docs/design/webhooks.md. Disabled by default so the chart installs cleanly
# anywhere; the gitops values.yaml enables it in the cluster.
webhookDrain:
  enabled: false
  schedule: "* * * * *"          # every minute
  activeDeadlineSeconds: 50      # a run must finish within the minute
  startingDeadlineSeconds: 30    # skip a tick if it can't start in time
  backoffLimit: 0                # don't retry a failed run; the next tick re-drains
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
