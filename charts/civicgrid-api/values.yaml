replicaCount: 1

image:
  repository: ghcr.io/kwamib/civicgrid-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# Redis is used as the rate-limit counter store. Falls back to in-memory
# (per-pod, not shared) if url is empty — useful for local dev.
# In-cluster default points at the Bitnami Redis chart installed via
# the gitops repo at infra/redis/.
redis:
  url: "redis://redis-master.redis.svc.cluster.local:6379/0"

# Admin token guards POST/GET/DELETE /admin/keys endpoints. Required for
# creating, listing, or revoking API keys. Must be set via existingSecret
# in production — the in-chart fallback (admin.token) is for local dev only.
admin:
  token: ""
  existingSecret: ""
  existingSecretKey: "ADMIN_TOKEN"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: civicgrid-api
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

# ServiceMonitor for Prometheus Operator integration.
# Disabled by default; clusters without Prometheus Operator (no ServiceMonitor CRD)
# would fail to install the chart otherwise.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
